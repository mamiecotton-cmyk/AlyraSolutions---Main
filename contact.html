<style>
:root{--bg:#06030f;--panel:#120a24;--text:#f4efff;--muted:#a79bc8;--line:rgba(139,92,246,.25);--violet:#7c3aed;--rose:#ec4899}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:940px;margin:0 auto;padding:0 1.5rem}
nav{position:sticky;top:0;z-index:20;background:rgba(8,4,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav-inner{height:74px;display:flex;align-items:center;justify-content:space-between}.logo img{height:72px}
.nav-links{display:flex;gap:1.25rem;list-style:none}.nav-links a{color:var(--muted);text-decoration:none;font-size:.77rem;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .7rem;border-radius:999px}.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(124,58,237,.2)}
header{padding:4rem 0 1.4rem}h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,5vw,3.7rem);margin-bottom:.6rem}.lead{color:var(--muted)}
form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.2rem;margin:1rem 0 4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.field{display:flex;flex-direction:column;gap:.35rem}.full{grid-column:1 / -1}
label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#b7acd4}
input,select,textarea{background:rgba(255,255,255,.04);border:1px solid rgba(139,92,246,.3);border-radius:10px;padding:.75rem .8rem;color:#fff;font-family:inherit}
textarea{min-height:140px;resize:vertical}
button{margin-top:.9rem;border:none;background:linear-gradient(135deg,var(--violet),var(--rose));color:#fff;padding:.75rem 1rem;border-radius:10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
footer{border-top:1px solid var(--line);padding:2rem 0;color:#8f84af;font-size:.8rem}
@media(max-width:820px){.logo img{height:58px}.nav-links{gap:.4rem;flex-wrap:wrap;justify-content:flex-end}.nav-links a{font-size:.65rem;padding:.35rem .45rem}.grid{grid-template-columns:1fr}}
</style>
</head>

<header><div class="container"><h1>Contact Alyra</h1><p class="lead">Tell us about your business and we will respond within one business day.</p></div></header>
